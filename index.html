<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大道國中｜平日中午加班申請表</title>
<style>
*{box-sizing:border-box}body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;margin:0;background:#eef3ef;color:#172c26}.tools{max-width:1100px;margin:20px auto;padding:18px;background:white;border-radius:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 15px #0001}.tools button{background:#173c30;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer}.tools button.secondary{background:#e1eae4;color:#173c30}.tools small{color:#52645d}.paper{width:297mm;min-height:210mm;background:white;margin:20px auto;padding:7mm 7mm;box-shadow:0 4px 25px #0002}h1{font-size:19px;text-align:center;margin:0 0 14px;font-weight:700}.meta{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:15px}.meta label{display:flex;align-items:center;gap:6px}.meta input{width:125px}.meta input.wide{width:180px}input,textarea{font:inherit;border:1px solid #a7b5ad;border-radius:3px;padding:4px 6px;background:transparent;color:inherit}input[type=number]{width:75px;text-align:center}.sheet{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px}.sheet th,.sheet td{border:1px solid #333;text-align:center;padding:7px 5px;height:50px}.sheet th{background:#f5f6f5}.sheet input,.sheet textarea{width:100%;border:0;outline:none;text-align:center}.sheet textarea{text-align:left;resize:vertical;height:32px;min-height:32px}.sheet td.reason{padding:2px 4px}.signature{text-align:right;margin:15px 20px 18px;font-size:16px}.notes{font-size:13px;line-height:1.6}.print-only{display:none}
@page{size:A4 landscape;margin:0}
@media print{html,body{width:297mm;background:white;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.tools{display:none!important}.paper{width:297mm;height:210mm;min-height:210mm;margin:0;padding:6mm 7mm;box-shadow:none;overflow:hidden}input,textarea{border:0!important;resize:none;overflow:hidden}.sheet th,.sheet td{height:50px;padding:5px 4px}.sheet textarea{height:32px}.print-only{display:inline}h1{margin-bottom:12px}}
@media screen and (max-width:1120px){.paper{transform-origin:top left;margin-left:12px}.tools{margin:10px}}
</style></head><body>
<div class="tools"><strong>大道國中｜平日中午加班申請表</strong><button onclick="window.print()">匯出 PDF／列印（A4 橫式）</button><button class="secondary" onclick="save()">儲存資料</button><button class="secondary" onclick="resetForm()">清空表單</button><small id="status">資料僅保存在此瀏覽器</small></div>
<main class="paper" id="form">
<h1>臺中市立大道國民中學兼任行政職務教師、職員 <input aria-label="民國年度" id="year" type="number" min="1" max="999" value="115" style="width:62px;border:0;border-bottom:1px solid #888;padding:0 2px;font-weight:bold"> 年 <input aria-label="月份" id="month" type="number" min="1" max="12" value="10" style="width:48px;border:0;border-bottom:1px solid #888;padding:0 2px;font-weight:bold"> 月平日中午加班申請表</h1>
<div class="meta"><label>處室：<input id="office" value="教務處"></label><label>職稱：<input id="job"></label><label>姓名：<input id="name"></label></div>
<table class="sheet"><colgroup><col style="width:8%"><col style="width:10%"><col style="width:28%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup><thead><tr><th>日期</th><th>加班時間</th><th>事由</th><th>簽到</th><th>簽退</th><th>單位主管核章</th></tr></thead><tbody id="rows"></tbody></table>
<div class="signature">校長核章：　　　　　　　　　</div>
<div class="notes">備註：請於事實發生之日起 1 個月內送核，陳核可後再行至差勤系統填寫「加班申請單」並選擇「紙本簽到退」，附件請上傳本表。</div>
</main>
<script>
const body=document.getElementById('rows');for(let i=0;i<10;i++){const tr=document.createElement('tr');tr.innerHTML='<td><input aria-label="日期" type="text" placeholder="例：10/1"></td><td><input aria-label="加班時間" value="12:30-13:00"></td><td class="reason"><textarea aria-label="加班事由" rows="1"></textarea></td><td></td><td></td><td></td>';body.appendChild(tr)}
const fields=()=>Array.from(document.querySelectorAll('#form input,#form textarea'));
function save(){try{localStorage.setItem('dadao-overtime-v1',JSON.stringify(fields().map(x=>x.value)));document.getElementById('status').textContent='已儲存於此瀏覽器'}catch(e){document.getElementById('status').textContent='無法儲存：請檢查瀏覽器設定'}}
function load(){try{const a=JSON.parse(localStorage.getItem('dadao-overtime-v1')||'null');if(a&&Array.isArray(a))fields().forEach((x,i)=>{if(a[i]!==undefined)x.value=a[i]})}catch(e){}}
function resetForm(){if(!confirm('確定清空所有填寫資料？'))return;localStorage.removeItem('dadao-overtime-v1');location.reload()}
document.getElementById('form').addEventListener('input',save);load();
</script></body></html>
